name: Release App

on:
  push:
    branches:
      - main
    # Don't cut a release for changes that don't affect the shipped app.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/**'
      - 'LICENSE'
      - '**/obj/**'
      - '**/bin/**'
      - '.serena/**'
      - '**/*.tsbuildinfo'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.semver.outputs.next_tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # ── Determine next semver tag ────────────────────────────────────────────
      - name: Determine bump and next version
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          [[ -z "${latest_tag}" ]] && latest_tag="v0.0.0"

          range=""
          if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          commit_messages=""
          if [[ -n "${range}" ]]; then
            commit_messages="$(git log --format=%s "${range}")"
          else
            commit_messages="$(git log --format=%s -n 1 "${{ github.sha }}")"
          fi

          bump="patch"
          if echo "${commit_messages}" | grep -Eqi '(^major:)|(#major)|BREAKING CHANGE|!:'; then
            bump="major"
          elif echo "${commit_messages}" | grep -Eqi '(^minor:)|(^feat(\(.+\))?:)|(#minor)'; then
            bump="minor"
          fi

          current="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "${current}"
          case "${bump}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}"             >> "$GITHUB_OUTPUT"
          echo "next_tag=${next_tag}"     >> "$GITHUB_OUTPUT"

      # ── Build frontend (Vite) ───────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: src/Themearr.Web
        run: |
          npm ci
          npm run build

      # ── Build .NET API ────────────────────────────────────────────────────────
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish linux-x64
        run: |
          dotnet publish src/Themearr.API/Themearr.API.csproj \
            -c Release -r linux-x64 --no-self-contained \
            -o _publish/linux-x64

      - name: Publish linux-arm64
        run: |
          dotnet publish src/Themearr.API/Themearr.API.csproj \
            -c Release -r linux-arm64 --no-self-contained \
            -o _publish/linux-arm64

      # ── Inject frontend into publish outputs ──────────────────────────────────
      - name: Inject frontend
        run: |
          cp -r src/Themearr.Web/out _publish/linux-x64/wwwroot
          cp -r src/Themearr.Web/out _publish/linux-arm64/wwwroot

      # Ship deploy.sh inside the release so the in-app updater runs the
      # checksum-verified, already-installed script instead of curl|bash from main.
      - name: Inject deploy script
        run: |
          cp deploy.sh _publish/linux-x64/deploy.sh
          cp deploy.sh _publish/linux-arm64/deploy.sh

      # ── Create tarballs ───────────────────────────────────────────────────────
      - name: Create tarballs
        run: |
          TAG=${{ steps.semver.outputs.next_tag }}
          mkdir -p _dist
          mv _publish/linux-x64   _publish/themearr-${TAG}-linux-x64
          mv _publish/linux-arm64 _publish/themearr-${TAG}-linux-arm64
          tar -czf _dist/themearr-linux-x64.tar.gz   -C _publish themearr-${TAG}-linux-x64
          tar -czf _dist/themearr-linux-arm64.tar.gz -C _publish themearr-${TAG}-linux-arm64
          # Publish SHA-256 checksums so install.sh / deploy.sh can verify the
          # tarball before extracting it (supply-chain integrity).
          ( cd _dist && sha256sum themearr-linux-x64.tar.gz   > themearr-linux-x64.tar.gz.sha256 )
          ( cd _dist && sha256sum themearr-linux-arm64.tar.gz > themearr-linux-arm64.tar.gz.sha256 )

      # ── Create GitHub release with binary assets ──────────────────────────────
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.semver.outputs.next_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.semver.outputs.next_tag }}
          generate_release_notes: true
          body: |
            Version bump: `${{ steps.semver.outputs.bump }}`
            Previous tag: `${{ steps.semver.outputs.latest_tag }}`
          files: |
            _dist/themearr-linux-x64.tar.gz
            _dist/themearr-linux-x64.tar.gz.sha256
            _dist/themearr-linux-arm64.tar.gz
            _dist/themearr-linux-arm64.tar.gz.sha256

  # ── Build & publish the multi-arch Docker image to GHCR ───────────────────────
  # Lets Docker users get updates with `docker compose pull` instead of rebuilding
  # from source. The heavy build stages run natively (BUILDPLATFORM) in the
  # Dockerfile, so the arm64 image isn't produced under slow emulation.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.release.outputs.next_tag }}
          tags: |
            ghcr.io/themearr/themearr:latest
            ghcr.io/themearr/themearr:${{ needs.release.outputs.next_tag }}
