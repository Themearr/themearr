name: CI

# The test steps in release.yml only run on push to main — and a merge to main cuts a
# release. Without this, a regression is caught after the merge that ships it, not
# before. Same commands, same versions, run on the PR instead.
on:
  pull_request:
    branches:
      - main
      - 'codex/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '**/obj/**'
      - '**/bin/**'
      - '**/*.tsbuildinfo'
  workflow_dispatch:

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test native deployment
        run: python3 -m unittest discover -s tests/deployment -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Themearr.Web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: src/Themearr.Web/package-lock.json

      - run: npm ci

      # Baseline is 0 errors and 3 warnings — three pre-existing warnings live in
      # login/page.tsx and lib/auth.tsx. --max-warnings 3 makes a fourth fail the build
      # instead of scrolling past in the log.
      - name: Lint
        run: npx eslint . --max-warnings 3

      - name: Typecheck
        run: |
          npx tsc --version
          npx tsc --noEmit

      - name: Test
        run: npm test

      # Catches a build-only break (asset resolution, Vite config) that tsc misses.
      - name: Build
        run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Release config, matching how release.yml runs it — a Release-only failure
      # must not first surface during a release.
      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: dotnet test tests/Themearr.API.Tests/Themearr.API.Tests.csproj -c Release --nologo

  # The unit suites both run against substitutes: the frontend in jsdom with `@/lib/api`
  # mocked, the API with handlers in isolation. Neither proves the built bundle is
  # actually served, that a deep link survives the SPA fallback, or that the auth
  # middleware is wired into a real pipeline. This job runs the shipped shape.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            src/Themearr.Web/package-lock.json
            tests/e2e/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Playwright points ASPNETCORE_WEBROOT at out/, so the bundle must exist first.
      - name: Build frontend
        working-directory: src/Themearr.Web
        run: |
          npm ci
          npm run build

      - name: Install E2E deps
        working-directory: tests/e2e
        run: npm ci

      # setup-node caches the npm store, not the browser. A Chromium build is ~95MB and
      # is pinned to the Playwright version, so the lockfile hash is the right key:
      # bumping @playwright/test changes the required build and correctly misses.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not the OS libraries it links against —
      # those are apt packages, installed outside ~/.cache/ms-playwright.
      - name: Install browser OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: tests/e2e
        run: npx playwright install-deps chromium

      - name: Install audio repair test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run E2E
        working-directory: tests/e2e
        run: npm test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  audio-image-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build native runtime image
        run: docker buildx build --platform linux/${{ matrix.architecture }} --load -t themearr-audio-test .
      - name: Verify tools and MP3 under runtime user
        run: |
          docker run --rm --platform linux/${{ matrix.architecture }} --entrypoint /bin/sh themearr-audio-test -c '
            set -eu
            test "$(id -u)" != 0
            ffmpeg -version
            ffprobe -version
            ffmpeg -v error -nostdin -f lavfi -i sine=frequency=440:duration=35 -t 30 -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k /tmp/theme.mp3
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/theme.mp3)" = mp3
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 /tmp/theme.mp3)" = 44100
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 /tmp/theme.mp3)" = 2
            case "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/theme.mp3)" in 30.*) ;; *) exit 1 ;; esac
          '
